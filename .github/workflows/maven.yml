name: Maven CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    types:
      - opened
      - reopened
      - synchronize
  workflow_dispatch:

jobs:
  build:
    name: Build with Maven on Java ${{ matrix.jdk }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        jdk: ['8', '11', '17', '21', '25']

    steps:
    - uses: actions/checkout@v4

    - name: Set up JDK ${{ matrix.jdk }}
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: ${{ matrix.jdk }}
        cache: 'maven'

    - name: Maven build and tests
      run: ./mvnw -B verify

  # The release archives are built on JDK 17 on purpose: it is the newest JDK
  # that still accepts -source/-target 7, and the POM targets Java 7 by
  # default so the jars keep the class file version of the previous releases.
  # On JDK 20 or later that default is raised to Java 8 automatically.
  # Bump this JDK only when the project deliberately raises the Java target.
  dist:
    name: Build distributions with Maven on Java 17
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'
        cache: 'maven'

    - name: Build source, binary and tools archives
      run: ./mvnw -B -DskipTests verify -Pdist

    - name: Upload archives
      uses: actions/upload-artifact@v4
      with:
        name: xerces-j-dist
        path: |
          target/Xerces-J-*.zip
          target/Xerces-J-*.tar.gz
        if-no-files-found: error
